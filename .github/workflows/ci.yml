name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: stdlib-only suite
        run: python -m unittest discover -s tests -v
      - name: end-to-end projection
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .
          redact-engine init-key --key "$RUNNER_TEMP/alias.key"
          redact-engine project --key "$RUNNER_TEMP/alias.key" --source examples/events.jsonl \
            --out "$RUNNER_TEMP/out" --verify
          redact-engine redact-text --key "$RUNNER_TEMP/alias.key" < examples/events.jsonl > /dev/null

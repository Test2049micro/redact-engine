[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redact-engine"
version = "0.1.0"
description = "Project a local activity stream into a redacted, alias-stable form that is safe to hand to a model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pii", "redaction", "pseudonymisation", "privacy", "activity-tracking", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
redact-engine = "redact_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
